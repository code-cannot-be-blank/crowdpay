{
  "name": "Validate issue 1099",
  "on": {
    "push": {
      "branches": [
        "validate/1099"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "regressions": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 6,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "20"
          }
        },
        {
          "run": "node --test backend/src/services/deadLetterTools.test.js"
        },
        {
          "run": "node --check backend/scripts/dead-letters.js"
        }
      ]
    }
  }
}